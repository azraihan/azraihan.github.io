# Short problem descriptions shown under "Ongoing Work" on the About page (no titles; work in progress).
- description: >-
    Self-supervised methods like LeJEPA prevent representation collapse by forcing embeddings to follow a fixed isotropic Gaussian distribution.
    I am studying what this constraint does to which features an encoder actually learns: with a fixed variance budget, features may compete for space,
    and one that is merely stable across augmented views, but useless downstream, could crowd out a feature the task needs.
    Feature suppression is well documented in contrastive learning, but whether it carries over to joint-embedding predictive architectures, which use no negatives at all, remains an open question.
